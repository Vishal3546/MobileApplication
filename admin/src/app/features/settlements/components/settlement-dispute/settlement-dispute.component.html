<div class="bg-red-50 p-6 rounded-lg shadow-md border-l-4 border-red-500 mb-8 mt-8">
  <h3 class="text-lg font-semibold text-red-900 mb-4">Disputes</h3>
  
  <form [formGroup]="disputeForm" (ngSubmit)="onRaiseDispute()">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Reason</mat-label>
        <mat-select formControlName="reason">
          <mat-option *ngFor="let r of disputeReasons" [value]="r">{{r}}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Claimed Amount (if applicable)</mat-label>
        <input matInput type="number" formControlName="claimedAmount" placeholder="0.00">
      </mat-form-field>
    </div>

    <div class="mt-4">
      <button mat-button class="bg-red-600 text-white px-6 py-2 rounded hover:bg-red-700 disabled:opacity-50" type="submit" [disabled]="disputeForm.invalid || isSubmitting">
        Raise Dispute
      </button>
    </div>
  </form>
</div>
