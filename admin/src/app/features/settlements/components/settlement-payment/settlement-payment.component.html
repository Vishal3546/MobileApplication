<div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-indigo-500 mb-8">
  <h3 class="text-lg font-semibold text-gray-700 mb-4">Record Payment</h3>
  
  <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
    {{errorMessage}}
  </div>

  <form [formGroup]="paymentForm" (ngSubmit)="onSubmit()">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Amount</mat-label>
        <input matInput type="number" formControlName="amount" placeholder="0.00" step="0.01">
        <mat-error *ngIf="paymentForm.get('amount')?.hasError('required')">Amount is required</mat-error>
        <mat-error *ngIf="paymentForm.get('amount')?.hasError('min')">Amount must be greater than 0</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Payment Mode</mat-label>
        <mat-select formControlName="paymentMode">
          <mat-option *ngFor="let mode of paymentModes" [value]="mode">{{mode}}</mat-option>
        </mat-select>
        <mat-error *ngIf="paymentForm.get('paymentMode')?.hasError('required')">Mode is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Reference Number (Txn ID)</mat-label>
        <input matInput formControlName="referenceNumber" placeholder="Bank Txn / UPI Ref">
      </mat-form-field>
    </div>

    <div class="mt-4">
      <button mat-raised-color="primary" class="bg-indigo-600 text-white px-6 py-2 rounded hover:bg-indigo-700 disabled:opacity-50" type="submit" [disabled]="paymentForm.invalid || isSubmitting || remainingAmount <= 0">
        {{isSubmitting ? 'Recording...' : 'Record Payment'}}
      </button>
    </div>
  </form>
</div>
