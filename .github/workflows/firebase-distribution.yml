name: Firebase App Distribution & In-App Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'version.json'  # Ignore version.json to prevent infinite loop
      - '**.md'
      - 'docs/**'

jobs:
  build_and_distribute:
    name: Build & Distribute APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Prevent infinite loop: Don't run if commit is from bot updating version.json
    if: "!contains(github.event.head_commit.message, 'Auto-update version.json')"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Debug APK (Secure)
        working-directory: android
        env:
          # Secure keystore from secrets (if you have release keystore)
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          chmod +x gradlew
          # Use debug keystore for Firebase distribution (secure)
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName="1.0.0.${{ github.run_number }}"

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          testers: kaushalp8095@gmail.com,vishalp577@gmail.com
          file: android/app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: |
            Automatic build v1.0.0.${{ github.run_number }} from GitHub Actions.
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0.${{ github.run_number }}
          name: MobileBiz Release v1.0.0.${{ github.run_number }}
          body: |
            Automatic release build v1.0.0.${{ github.run_number }}
            Commit: ${{ github.sha }}
            Download APK below or via in-app update.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json (with skip ci)
        run: |
          cat <<EOF > version.json
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.0.${{ github.run_number }}",
            "downloadUrl": "https://github.com/Vishal3546/MobileApplication/releases/download/v1.0.0.${{ github.run_number }}/app-debug.apk",
            "releaseNotes": "Bug fixes and new features v1.0.0.${{ github.run_number }}",
            "minVersionCode": 50,
            "forceUpdate": false
          }
          EOF
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          # Use [skip ci] to prevent triggering CI again - FIXES INFINITE LOOP
          git commit -m "Auto-update version.json to v1.0.0.${{ github.run_number }} [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push failed or skipped"
