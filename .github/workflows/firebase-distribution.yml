name: Firebase App Distribution & In-App Release

on:
  push:
    branches:
      - main

jobs:
  build_and_distribute:
    name: Build & Distribute APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName="1.0.0.${{ github.run_number }}"

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          testers: kaushalp8095@gmail.com,vishalp577@gmail.com
          file: android/app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: |
            Automatic build v1.0.0.${{ github.run_number }} from GitHub Actions.
            Commit: ${{ github.sha }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0.${{ github.run_number }}
          name: MobileBiz Release v1.0.0.${{ github.run_number }}
          body: Automatic release build v1.0.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json
        run: |
          cat <<EOF > version.json
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.0.${{ github.run_number }}",
            "downloadUrl": "https://github.com/Vishal3546/MobileApplication/releases/download/v1.0.0.${{ github.run_number }}/app-debug.apk",
            "releaseNotes": "Bug fixes and new features v1.0.0.${{ github.run_number }}"
          }
          EOF
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Auto-update version.json to v1.0.0.${{ github.run_number }}" || echo "No changes to commit"
          git push origin main || echo "Push failed or skipped"
