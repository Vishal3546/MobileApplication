name: Mobile Biz CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Run Backend Tests
      run: |
        cd backend
        # rerunFailingTestsCount=1: ek flaky failure (slow runner pe concurrency/timing tests)
        # ko ek baar auto-retry karta hai; consistent failure ab bhi build fail karega.
        ./mvnw clean test -Dsurefire.rerunFailingTestsCount=1

  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: admin/package-lock.json
    - name: Run Angular Tests and Build
      run: |
        cd admin
        npm ci
        npm test -- --watch=false
        npx ng build --configuration production

  android-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Run Android Build
      run: |
        cd android
        ./gradlew test assembleDebug
