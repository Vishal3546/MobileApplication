spring.application.name=backend
server.port=8080

# =========================================================
# PostgreSQL Configuration
# =========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =========================================================
# Flyway Configuration
# =========================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# =========================================================
# Redis / Upstash Configuration
# =========================================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}

# =========================================================
# JWT Configuration
# =========================================================
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION_MS:3600000}
jwt.refreshExpirationMs=${REFRESH_TOKEN_EXPIRATION_MS:86400000}

# =========================================================
# CORS
# =========================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# =========================================================
# Initial Admin Password
# =========================================================
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD}

# =========================================================
# KYC Encryption
# IMPORTANT: Production secret must come from Render
# =========================================================
kyc.encryption.key=${KYC_ENCRYPTION_KEY}

# =========================================================
# S3-Compatible Object Storage
# Supabase Storage can be used through its S3-compatible API
# =========================================================
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.region=${AWS_S3_REGION}
aws.s3.access-key=${AWS_ACCESS_KEY}
aws.s3.secret-key=${AWS_SECRET_KEY}
aws.s3.endpoint=${AWS_S3_ENDPOINT}
aws.s3.force-path-style=${AWS_S3_FORCE_PATH_STYLE:true}

# =========================================================
# Actuator
# =========================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized