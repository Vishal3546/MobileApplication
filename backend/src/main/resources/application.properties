spring.application.name=backend
server.port=8080

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION_MS}
jwt.refreshExpirationMs=${REFRESH_TOKEN_EXPIRATION_MS}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:admin123}

# SECURITY: The KYC_ENCRYPTION_KEY must be a highly secure, randomly generated string with sufficient cryptographic entropy (e.g. 32+ bytes generated via /dev/urandom).
# Do not use an arbitrary human password. Do not hardcode the production secret here or store it in Git.
# The string will be SHA-256 hashed internally to derive the 256-bit AES key.
kyc.encryption.key=${KYC_ENCRYPTION_KEY:default-dev-secret-key-that-is-at-least-32-bytes-long}
app.storage.local.root-dir=${STORAGE_LOCAL_ROOT_DIR:/data/media}
