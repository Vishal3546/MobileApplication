spring.application.name=backend
server.port=8080

# =========================================================
# PostgreSQL
# =========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =========================================================
# Flyway
# =========================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# =========================================================
# Redis / Upstash
# Local: REDIS_SSL_ENABLED=false
# Production: REDIS_SSL_ENABLED=true
# =========================================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

# =========================================================
# JWT
# =========================================================
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION_MS:3600000}
jwt.refreshExpirationMs=${REFRESH_TOKEN_EXPIRATION_MS:86400000}

# =========================================================
# Actuator
# Only health endpoint exposed
# Do not expose full health details publicly
# =========================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized

# =========================================================
# CORS
# Local development default
# Production value must come from Render environment variable
# =========================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# =========================================================
# Initial Admin Password
# Use environment variable in production
# =========================================================
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:admin123}

# =========================================================
# KYC Encryption
# Development fallback only
# NEVER use this default in production
# =========================================================
kyc.encryption.key=${KYC_ENCRYPTION_KEY:default-dev-secret-key-that-is-at-least-32-bytes-long}

# =========================================================
# Local Media Storage
# Development only
# Production will use S3-compatible storage configuration
# =========================================================
app.storage.local.root-dir=${STORAGE_LOCAL_ROOT_DIR:/data/media}